title: "Jaffle Shop Analytics Executive Dashboard"
source: db

queries:
  kpi_metrics: |
    select
      sum(o.order_total) as total_revenue,
      count(distinct o.order_id) as total_orders,
      count(distinct o.customer_id) as active_customers
    from {{ ref('stg_orders') }} o

  revenue_over_time: |
    select
      date_trunc('month', o.order_date) as order_month,
      sum(o.order_total) as monthly_revenue
    from {{ ref('stg_orders') }} o
    group by 1
    order by 1

  product_sales: |
    select
      p.product_type,
      sum(p.product_price) as gross_sales
    from {{ ref('stg_order_items') }} oi
    join {{ ref('stg_products') }} p on oi.product_id = p.product_id
    group by 1
    order by 2 desc

  top_customers: |
    select
      c.customer_name,
      count(distinct o.order_id) as lifetime_orders,
      sum(o.order_total) as lifetime_spend
    from {{ ref('stg_customers') }} c
    join {{ ref('stg_orders') }} o on c.customer_id = o.customer_id
    group by 1
    order by 3 desc
    limit 10

charts:
  kpi_rev:
    label: "Total Revenue"
    query: kpi_metrics
    type: kpi
    value: total_revenue
    style:
      value:
        format: currency_whole

  kpi_orders:
    label: "Total Orders"
    query: kpi_metrics
    type: kpi
    value: total_orders

  kpi_cust:
    label: "Unique Customers"
    query: kpi_metrics
    type: kpi
    value: active_customers

  revenue_trend:
    title: "Monthly Revenue Fluctuations"
    query: revenue_over_time
    type: line
    x: order_month
    y: monthly_revenue
    height: 300

  product_mix:
    title: "Gross Sales by Product Type"
    query: product_sales
    type: bar
    x: product_type
    y: gross_sales
    height: 300
    sort:
      by: gross_sales
      order: desc

  customer_leaderboard:
    title: "Top 10 Customers by Value"
    query: top_customers
    type: table
    style:
      columns:
        customer_name:
          label: "Customer"
        lifetime_orders:
          label: "Orders Placed"
          align: right
        lifetime_spend:
          label: "Total Spend"
          format: currency_whole
          align: right

rows:
  - cols:
      - width: "33%"
        rows: [kpi_rev]
      - width: "33%"
        rows: [kpi_orders]
      - width: "34%"
        rows: [kpi_cust]

  - cols:
      - width: "50%"
        rows: [revenue_trend]
      - width: "50%"
        rows: [product_mix]

  - cols:
      - width: "100%"
        rows: [customer_leaderboard]
